# conda environment for the UR7e x LeRobot x GELLO stack.
#
#   conda env create -f envs/ur7e.yaml          # first time
#   conda env update -f envs/ur7e.yaml --prune  # after editing this file
#
# ===========================================================================
#  THIS FILE IS THE PLACE TO ADD A DEPENDENCY.
#  Add the package below, re-run the update command, commit the change. Same
#  workflow as envs/so101.yaml and envs/smolvla.yaml on the Spark. Do not
#  `pip install` into the env ad hoc -- it is lost on the next rebuild and the
#  next person cannot reproduce your environment.
# ===========================================================================
#
# Difference from envs/so101.yaml, on purpose: that file carries the editable
# install line (`-e /home/robots/lerobot[...]`) inside the yaml. This one does
# not, because this repo is also developed on a non-Spark box where the user is
# not `robots`, and a hard-coded /home/robots path silently builds the env
# against a tree that is not there. `scripts/setup_env.sh` performs the five
# editable installs with paths computed from the checkout location:
#
#   <ur7e root>/lerobot                              lerobot core, pinned v0.6.0
#   <ur7e root>/lerobot_ur7e_gello/ur7e_site         site config loader
#   <ur7e root>/lerobot_ur7e_gello/lerobot_robot_ur7e
#   <ur7e root>/lerobot_ur7e_gello/lerobot_teleoperator_gello
#   <ur7e root>/lerobot_ur7e_gello/lerobot_teleoperator_keyboard_joint
#
# The lerobot core clone is deliberately NOT the shared ~/lerobot that the
# SO-101 / OpenArm / smolvla / pi environments install from: this stack pins
# v0.6.0 and would drag that shared clone off whatever ref those envs expect.
#
# --------------------------------------------------------------------------
# Pin rationale:
#   python 3.12   : lerobot v0.6.0 requires-python >= 3.12
#   ffmpeg 7.1.1  : 8.x is not supported by the torchcodec build we use
#   torch         : lerobot v0.6.0 allows >=2.7,<2.12. Pinned PER ARCH, see below.
#   cu130         : sm_120 kernels (RTX 5080). NOTE GB10 is sm_121 and torch
#                   2.10 does not ship sm_121 -- it PTX-JITs from compute_120,
#                   which costs a one-off delay at first kernel launch. The
#                   so101 / openarm / smolvla environments run this same
#                   combination on the Sparks today, so it works; 2.11 may ship
#                   sm_121 natively, check `torch.cuda.get_arch_list()`.
#   torchcodec    : must match torch, and the error when it does not is
#                   "undefined symbol: torch_dtype_..." at import, NOT a
#                   version complaint. Pairs: torch 2.10 <-> 0.10.x,
#                   torch 2.11 <-> 0.11.x.
#   rerun-sdk     : what lerobot[viz] pulls in; listed directly so it can be
#                   added/removed here without touching the extras string.
#
# WHY THE PER-ARCH SPLIT
#   torchcodec has NO aarch64 wheel before 0.11.0 (verified on PyPI), and
#   0.11 requires torch >= 2.11. So x86_64 and aarch64 cannot share one pin:
#     x86_64  : torch 2.10.0 + torchcodec 0.10.0  <- the combination the full
#               verification ladder went green on
#     aarch64 : torch 2.11.0 + torchcodec 0.11.1  <- the only pair that has
#               wheels for both, and still inside lerobot's torch<2.12
#   pip environment markers do the selection, so one file serves both.
#
# NOT here on purpose:
#   pyrealsense2  : `conda install pyrealsense2` instead -- the version
#                   lerobot[intelrealsense] pins has no aarch64 wheel.
#                   See the "Intel Realsense セットアップ手順" wiki page.
#   ur_rtde       : pulled in as a dependency of lerobot_robot_ur7e. On aarch64
#                   there is no wheel, so Boost must be installed FIRST or the
#                   source build fails halfway. See docs/MIGRATION.md §2.
name: ur7e
channels:
  - conda-forge
dependencies:
  - python=3.12
  - ffmpeg=7.1.1        # 8.x is NOT yet supported
  - ipython
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      # x86_64 (RTX 5080 dev box)
      - torch==2.10.0+cu130       ; platform_machine == "x86_64"
      - torchvision==0.25.0+cu130 ; platform_machine == "x86_64"
      - torchcodec==0.10.0        ; platform_machine == "x86_64"
      # aarch64 (DGX Spark, GB10)
      - torch==2.11.0+cu130       ; platform_machine == "aarch64"
      - torchvision==0.26.0+cu130 ; platform_machine == "aarch64"
      - torchcodec==0.11.1        ; platform_machine == "aarch64"
      # arch-independent
      - rerun-sdk>=0.24.0,<0.34.0
