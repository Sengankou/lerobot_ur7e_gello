[project]
name = "lerobot_teleoperator_keyboard_joint"
version = "0.1.0"
description = "Keyboard joint-jog teleoperator for UR arms: emits the same 7-wide joint action dict as the GELLO leader, so the LeRobot pipeline can be exercised (and the arm jogged) without the leader hardware."
requires-python = ">=3.11"

dependencies = [
    "lerobot",
    "ur-rtde>=1.6.2",
]

[tool.setuptools]
packages = ["lerobot_teleoperator_keyboard_joint"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
